<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" role="img" aria-labelledby="t d">
<title id="t">How Eksoda imports a receipt</title>
<desc id="d">The Android app sends a receipt link to the REST API, which queues an import job in Redis. A Celery worker fetches the provider's receipt page over HTTPS, the provider adapter parses and validates it, lines are matched to products with unit prices, and everything is stored in PostgreSQL in one transaction. The API answers the app's queries from PostgreSQL.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 15px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
.sub { font-size: 12px; fill: #59636e; text-anchor: middle; }
.label { font-size: 12px; fill: #59636e; }
.edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
</style>
</defs>
<rect width="1040" height="250" fill="#ffffff" rx="0"/>
<rect x="20" y="30" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="95.0" y="57" class="title">Android app</text><text x="95.0" y="77" class="sub">scans the QR code</text><rect x="232" y="30" width="150" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="307.0" y="57" class="title">REST API</text><text x="307.0" y="77" class="sub">Django + DRF</text><rect x="444" y="30" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="519.0" y="57" class="title">Job queue</text><text x="519.0" y="77" class="sub">Redis</text><rect x="656" y="30" width="150" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="731.0" y="57" class="title">Import worker</text><text x="731.0" y="77" class="sub">Celery</text><rect x="868" y="30" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="943.0" y="57" class="title">Receipt page</text><text x="943.0" y="77" class="sub">e-invoicing provider</text><rect x="232" y="160" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="307.0" y="187" class="title">PostgreSQL</text><text x="307.0" y="207" class="sub">receipts and prices</text><rect x="444" y="160" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="519.0" y="187" class="title">Matching</text><text x="519.0" y="207" class="sub">products, unit prices</text><rect x="656" y="160" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="731.0" y="187" class="title">Provider adapter</text><text x="731.0" y="207" class="sub">parse and validate</text>
<line x1="174" y1="54.0" x2="228" y2="54.0" class="edge" marker-end="url(#head)"/><text x="201.0" y="46.0" class="label" text-anchor="middle">link</text><line x1="228" y1="70.0" x2="174" y2="70.0" class="edge" marker-end="url(#head)"/><text x="201.0" y="88.0" class="label" text-anchor="middle">JSON</text><line x1="386" y1="62.0" x2="440" y2="62.0" class="edge" marker-end="url(#head)"/><text x="413.0" y="52.0" class="label" text-anchor="middle">job</text><line x1="598" y1="62.0" x2="652" y2="62.0" class="edge" marker-end="url(#head)"/><line x1="810" y1="62.0" x2="864" y2="62.0" class="edge" marker-end="url(#head)"/><text x="837.0" y="52.0" class="label" text-anchor="middle">HTTPS</text><line x1="731.0" y1="98" x2="731.0" y2="156" class="edge" marker-end="url(#head)"/><text x="741.0" y="131.0" class="label" text-anchor="start">page</text><line x1="652" y1="192.0" x2="598" y2="192.0" class="edge" marker-end="url(#head)"/><text x="625.0" y="182.0" class="label" text-anchor="middle">receipt</text><line x1="440" y1="192.0" x2="386" y2="192.0" class="edge" marker-end="url(#head)"/><text x="413.0" y="182.0" class="label" text-anchor="middle">store</text><line x1="307.0" y1="156" x2="307.0" y2="98" class="edge" marker-end="url(#head)"/><text x="317.0" y="131.0" class="label" text-anchor="start">queries</text>
